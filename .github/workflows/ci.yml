name: CI

on:
  push:
    branches: [master, main, "release/**"]
  pull_request:
    branches: [master, main, "release/**"]

# Read-only by default; only the job that publishes gets write access. Nothing here uses
# OIDC (the signing action authenticates with a client secret), so there is no id-token grant.
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/Sendspin.Windows/Sendspin.Windows.csproj'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The test projects were being compiled by the build above but never executed, so a red
      # suite could sit unnoticed on a green PR.
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # Dev builds - create signed installers for every push to branches
  dev-build:
    runs-on: windows-latest
    # Only run on direct pushes to master, not PRs, tags (tags use release.yml) or release
    # branches, which get the build and test job above but no dev prerelease.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write  # Creates the dev prerelease and deletes old ones

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate dev version
        id: version
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $version = "0.0.0-dev.$shortSha"
          # AssemblyVersion and FileVersion must be purely numeric
          $numericVersion = "0.0.0.0"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "NUMERIC_VERSION=$numericVersion" >> $env:GITHUB_OUTPUT
          echo "SHORT_SHA=$shortSha" >> $env:GITHUB_OUTPUT
          echo "Dev version: $version (numeric: $numericVersion)"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build Release
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.version.outputs.NUMERIC_VERSION }} -p:FileVersion=${{ steps.version.outputs.NUMERIC_VERSION }}

      - name: Publish win-x64 (framework-dependent)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.version.outputs.NUMERIC_VERSION }} -p:FileVersion=${{ steps.version.outputs.NUMERIC_VERSION }} -o src/Sendspin.Windows/bin/publish/win-x64-framework

      - name: Publish win-x64 (self-contained)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:Version=${{ steps.version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.version.outputs.NUMERIC_VERSION }} -p:FileVersion=${{ steps.version.outputs.NUMERIC_VERSION }} -o src/Sendspin.Windows/bin/publish/win-x64-selfcontained

      # Sign the main application EXEs before creating installers
      - name: Sign Application EXEs (framework-dependent)
        uses: Azure/artifact-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: src/Sendspin.Windows/bin/publish/win-x64-framework
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Application EXEs (self-contained)
        uses: Azure/artifact-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: src/Sendspin.Windows/bin/publish/win-x64-selfcontained
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create dist directory
        run: New-Item -ItemType Directory -Force -Path dist

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer (framework-dependent)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.VERSION }} /DBuildType=framework installer/Sendspin.Windows.iss

      - name: Build Installer (self-contained)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.VERSION }} /DBuildType=selfcontained installer/Sendspin.Windows.iss
          # List output to verify
          Get-ChildItem -Path dist -Recurse

      # Sign the installer EXEs
      - name: Sign Installer EXEs
        uses: Azure/artifact-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create portable ZIPs
        run: |
          Compress-Archive -Path src/Sendspin.Windows/bin/publish/win-x64-framework/* -DestinationPath dist/Sendspin.Windows-${{ steps.version.outputs.VERSION }}-portable-win-x64.zip
          Compress-Archive -Path src/Sendspin.Windows/bin/publish/win-x64-selfcontained/* -DestinationPath dist/Sendspin.Windows-${{ steps.version.outputs.VERSION }}-portable-selfcontained-win-x64.zip

      # Clean up old dev prereleases (keep last 5)
      - name: Clean up old dev prereleases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        with:
          keep_latest: 5
          delete_tag_pattern: v0.0.0-dev
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dev Prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Dev Build ${{ steps.version.outputs.SHORT_SHA }}
          body: |
            ⚠️ **Development Build** - Not for production use

            This is an automated development build from commit [`${{ steps.version.outputs.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            **Changes in this build:**
            ${{ github.event.head_commit.message }}

            ---
            📦 **Downloads:**
            - `Sendspin.Windows-...-Setup.exe` - Requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)
            - `Sendspin.Windows-...-Setup-SelfContained.exe` - Standalone (no .NET required)
            - Portable ZIPs also available

            🔐 All executables are code-signed.
          draft: false
          prerelease: true
          files: |
            dist/Sendspin.Windows-${{ steps.version.outputs.VERSION }}-Setup.exe
            dist/Sendspin.Windows-${{ steps.version.outputs.VERSION }}-Setup-SelfContained.exe
            dist/Sendspin.Windows-${{ steps.version.outputs.VERSION }}-portable-win-x64.zip
            dist/Sendspin.Windows-${{ steps.version.outputs.VERSION }}-portable-selfcontained-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
